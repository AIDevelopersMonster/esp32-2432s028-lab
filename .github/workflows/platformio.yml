name: PlatformIO Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate electrical truth profile
        run: python tools/validate_board_profile.py

      - name: Validate B2 HIL parser fixture
        run: python tools/parse_b2_hil.py tests/fixtures/b2-hil-pass.log --require-sd

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run
