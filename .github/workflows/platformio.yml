name: PlatformIO Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate electrical truth profile
        run: python tools/validate_board_profile.py

      - name: Validate B2 HIL parser fixture
        run: python tools/parse_b2_hil.py tests/fixtures/b2-hil-pass.log --require-sd

      - name: Validate B3 diagnostic parser fixture
        run: python tools/parse_b3_diagnostics.py tests/fixtures/b3-diagnostics-pass.log --require-sd --require-diagnostics

      - name: Validate B4 evidence parser fixture
        run: python tools/parse_b4_evidence.py tests/fixtures/b4-evidence-pass.log --min-records 4 --require-sd

      - name: Validate B5 archive parser fixture
        run: python tools/parse_b5_archive.py tests/fixtures/b5-archive-pass.log --min-records 4 --require-sd

      - name: Validate B6 service parser fixture
        run: python tools/parse_b6_service.py tests/fixtures/b6-service-pass.log --min-records 4 --require-sd --require-export

      - name: Validate B7 soak parser fixture
        run: python tools/parse_b7_soak.py tests/fixtures/b7-soak-pass.log --min-records 4 --min-uptime-ms 20000 --require-sd

      - name: Build reproducible B7 fixture pack
        run: python tools/build_b7_qualification_pack.py tests/fixtures/b7-soak-pass.log --output build/b7-pack --board-id fixture-board --firmware-commit fixture-commit --card-id fixture-card

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run
